<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>施業状況ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* layout: 上に集計、中央に一覧、行をタッチすると右から詳細パネル */
  --bg: #F3F5F4;
  --surface: #FFFFFF;
  --ink: #13201A;
  --muted: #5B6B63;
  --line: #D8DFDB;
  --accent: #0E5A78;
  --accent-ink: #FFFFFF;
  --good: #1E7A47;
  --good-bg: #DDF1E5;
  --idle: #4B5A53;
  --idle-bg: #E6EBE8;
  --note: #8A5A00;
  --note-bg: #FBEBC8;
  --cur: #D32F2F; --cur-ink: #FFFFFF; --cur-bg: #FBE3E1; --next: #E08A00; --next-bg: #FDF0D8;
  --font-body: "Noto Sans JP", "Yu Gothic UI", "Hiragino Sans", "Meiryo", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1613; --surface: #18221D; --ink: #EAF1ED; --muted: #9DB0A6; --line: #2C3B34;
    --accent: #5CC0E8; --accent-ink: #06222E; --good: #6FD39A; --good-bg: #16382A;
    --idle: #B5C4BC; --idle-bg: #24312B; --note: #F2C46B; --note-bg: #3A2E10;
    --cur: #E5534B; --cur-ink: #1A0605; --cur-bg: #3F1B19; --next: #F2A93B; --next-bg: #3A2C12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1613; --surface: #18221D; --ink: #EAF1ED; --muted: #9DB0A6; --line: #2C3B34;
  --accent: #5CC0E8; --accent-ink: #06222E; --good: #6FD39A; --good-bg: #16382A;
  --idle: #B5C4BC; --idle-bg: #24312B; --note: #F2C46B; --note-bg: #3A2E10;
  --cur: #E5534B; --cur-ink: #1A0605; --cur-bg: #3F1B19; --next: #F2A93B; --next-bg: #3A2C12;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { font-size: max(11px, calc(100vw / 110)); height: 100%; }
body {
  margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, tr:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; gap: 1rem; padding: 1.2rem 1.6rem 1rem; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 2rem; font-weight: 700; letter-spacing: .02em; }
.tabs { display: flex; gap: .6rem; flex-wrap: wrap; }
.tab {
  min-height: 3rem; padding: 0 1.4rem; border: 2px solid var(--line); background: var(--surface);
  border-radius: .7rem; font-size: 1.25rem; font-weight: 500;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.hr { display: flex; align-items: center; gap: 1.2rem; }
.emb { font: inherit; font-size: 1.4rem; font-weight: 700; padding: .7rem 1.6rem; border-radius: .7rem; border: 2px solid #1d4ed8; background: #fff; color: #1d4ed8; cursor: pointer; }
.emb.on { background: #d97706; border-color: #d97706; color: #fff; }
body.em tbody td.ord, body.em tbody .pill { outline: 2px dashed #d97706; outline-offset: -2px; cursor: pointer; }
.clock { font-size: 1.35rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* summary */
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1rem; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: .8rem; padding: .8rem 1.1rem; min-width: 0; }
.tile .k { font-size: 1rem; color: var(--muted); }
.tile .v { font-size: 2.2rem; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile .v small { font-size: 1.05rem; font-weight: 500; color: var(--muted); margin-left: .25rem; }
.tile .sub { font-size: .95rem; color: var(--muted); margin-top: .1rem; font-variant-numeric: tabular-nums; }
.bar { height: .6rem; border-radius: .3rem; background: var(--idle-bg); overflow: hidden; margin-top: .45rem; }
.bar > i { display: block; height: 100%; background: var(--good); border-radius: .3rem; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: .6rem 2rem; align-items: center; }
.fgroup { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.fgroup .lab { color: var(--muted); font-size: 1.05rem; margin-right: .2rem; }
.chip {
  min-height: 2.6rem; padding: 0 1.05rem; border: 2px solid var(--line); background: var(--surface);
  border-radius: 2rem; font-size: 1.1rem;
}
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.count { margin-left: auto; color: var(--muted); font-size: 1.05rem; }

/* list */
.listwrap { flex: 1; min-height: 0; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: .8rem; }
table { width: 100%; min-width: 0; border-collapse: separate; border-spacing: 0; }
thead th {
  position: sticky; top: 0; z-index: 1; background: var(--surface); text-align: left; font-weight: 500;
  font-size: 1rem; color: var(--muted); padding: .6rem .9rem; border-bottom: 2px solid var(--line); white-space: nowrap;
}
th.r, td.r { text-align: right; }
tbody tr { cursor: pointer; }
tbody td { padding: .55rem .9rem; border-bottom: 1px solid var(--line); font-size: 1.2rem; vertical-align: middle; }
tbody tr:active td, tbody tr.sel td { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
td.no { font-weight: 700; white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
td.place { min-width: 8.5rem; }
thead th { font-size: .85rem; padding: .5rem .3rem; line-height: 1.25; }
tbody td { padding: .4rem .3rem; font-size: .95rem; }
td.sp { min-width: 7.5rem; }
td.nw, th.nw { white-space: nowrap; }
th.stk0, td.ord { position: sticky; left: 0; z-index: 2; background: var(--surface); min-width: 3rem; width: 3rem; }
th.stk1, td.no { position: sticky; left: 3rem; z-index: 2; background: var(--surface); min-width: 5.6rem; }
th.stk2, td.place { position: sticky; left: 8.6rem; z-index: 2; background: var(--surface); border-right: 2px solid var(--line); }
thead th.stk0, thead th.stk1, thead th.stk2 { z-index: 3; }
th.c, td.c { text-align: center; }
th.g, td.g { border-left: 1px solid var(--line); }
td.nt { min-width: 9rem; }
tfoot td { position: sticky; bottom: 0; z-index: 1; background: var(--surface); border-top: 2px solid var(--ink); border-bottom: 0;
  font-weight: 700; font-size: .95rem; padding: .55rem .3rem; }
tfoot td.no, tfoot td.place, tfoot td.ord { z-index: 3; }
tfoot td small { font-weight: 500; }
td.nt .tag { white-space: normal; }
td.ord { text-align: center; font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
td.ord.fin { color: var(--muted); font-weight: 500; }
tbody tr.cur td { background: var(--cur-bg); }
tbody tr.cur td.ord { background: var(--cur); color: var(--cur-ink); font-size: 1.35rem; }
tbody tr.next td.ord { background: var(--next-bg); color: var(--next); box-shadow: inset 0 0 0 3px var(--next); }
.mk { display: inline-block; padding: .05rem .7rem; border-radius: 2rem; font-size: 1.05rem; font-weight: 700; }
.mk.cur { background: var(--cur); color: var(--cur-ink); }
.mk.next { background: var(--next-bg); color: var(--next); box-shadow: inset 0 0 0 2px var(--next); }
.lg { display: inline-block; width: .9em; height: .9em; border-radius: .2em; vertical-align: -.1em; margin: 0 .25em 0 .8em; }
.lg.cur { background: var(--cur); } .lg.next { background: var(--next-bg); box-shadow: inset 0 0 0 2px var(--next); }
td.ord { cursor: pointer; }
tbody td.ord:active { filter: brightness(.92); }
.pk-scrim { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.42); display: none; }
.pk { position: fixed; z-index: 90; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(46rem, 94vw);
  background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; padding: 1.5rem; box-shadow: 0 1rem 3rem rgba(0,0,0,.3); display: none; }
.pk-scrim.on, .pk.on { display: block; }
.pk h3 { margin: 0 0 .2rem; font-size: 1.5rem; }
.pk .sub { color: var(--muted); font-size: 1.1rem; margin-bottom: 1rem; }
.pkgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .6rem; margin-bottom: 1rem; }
.pkn { position: relative; min-height: 3.8rem; font-size: 1.5rem; font-weight: 700; border: 2px solid var(--line); background: var(--surface); border-radius: .7rem; }
.pkn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pkn.used:not([aria-pressed="true"]) { color: var(--muted); background: var(--idle-bg); }
.pkn.used::after { content: ""; position: absolute; top: .4rem; right: .4rem; width: .5rem; height: .5rem; border-radius: 50%; background: var(--muted); }
.pkact { display: flex; gap: .7rem; flex-wrap: wrap; }
.pkb { min-height: 3.2rem; padding: 0 1.2rem; border: 2px solid var(--line); background: var(--surface); border-radius: .7rem; font-size: 1.15rem; font-weight: 500; }
.pkb.red { background: var(--cur); border-color: var(--cur); color: var(--cur-ink); font-weight: 700; }
.pkb:disabled { opacity: .4; cursor: default; }
.pk .hint { color: var(--muted); font-size: .95rem; margin-top: .8rem; }
.chk { font-weight: 700; color: var(--good); font-size: 1.05rem; }
td small { color: var(--muted); font-size: .8em; margin-left: .15em; }
.na { color: var(--muted); }
.mini { display: flex; align-items: center; gap: .6rem; min-width: 10rem; }
.mini .bar { flex: 1; margin: 0; }
.mini span { font-variant-numeric: tabular-nums; min-width: 3.2rem; text-align: right; font-size: 1.1rem; }

.pill { display: inline-block; padding: .1rem .8rem; border-radius: 2rem; font-size: 1.05rem; font-weight: 700; white-space: nowrap; }
.pill.done { background: var(--good-bg); color: var(--good); }
.pill.idle { background: var(--idle-bg); color: var(--idle); }
.pill.na { background: transparent; color: var(--muted); font-weight: 500; }
.tag { display: inline-block; padding: .05rem .6rem; border-radius: .4rem; background: var(--note-bg); color: var(--note); font-size: 1rem; font-weight: 500; }

.empty { padding: 3rem; text-align: center; color: var(--muted); font-size: 1.3rem; }
.foot { color: var(--muted); font-size: .9rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

/* detail panel */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; }
.scrim.on { opacity: 1; pointer-events: auto; }
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 60; width: min(54rem, 100vw); background: var(--surface);
  border-left: 1px solid var(--line); box-shadow: -.5rem 0 2rem rgba(0,0,0,.18);
  transform: translateX(105%); display: flex; flex-direction: column;
}
.panel.on { transform: none; }
@media (prefers-reduced-motion: no-preference) {
  .scrim { transition: opacity .2s; }
  .panel { transition: transform .22s ease; }
}
.phead { display: flex; align-items: flex-start; gap: 1rem; padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--line); }
.phead .t { flex: 1; min-width: 0; }
.phead .no { font-size: 1.15rem; color: var(--muted); }
.phead h2 { margin: .1rem 0 .4rem; font-size: 2rem; line-height: 1.25; text-wrap: balance; }
.phead .badges { display: flex; gap: .5rem; flex-wrap: wrap; }
.pbtn {
  min-width: 3.4rem; min-height: 3.4rem; border: 2px solid var(--line); background: var(--surface);
  border-radius: .7rem; font-size: 1.4rem;
}
.pbtn.close { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 0 1.2rem; font-size: 1.2rem; }
.pbtn:disabled { opacity: .35; cursor: default; }
.pbody { flex: 1; overflow: auto; padding: 1.2rem 1.5rem 2rem; display: flex; flex-direction: column; gap: 1.4rem; }
.sec h3 { margin: 0 0 .6rem; font-size: 1.1rem; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); padding-bottom: .3rem; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem 1.2rem; }
.item .k { font-size: .95rem; color: var(--muted); }
.item .v { font-size: 1.55rem; font-weight: 500; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.item .v small { font-size: 1rem; color: var(--muted); margin-left: .2rem; }
.big { display: flex; align-items: baseline; gap: .8rem; margin-bottom: .9rem; }
.big .v .na { font-size: 2rem; }
.big .v { font-size: 3rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.big .of { color: var(--muted); font-size: 1.2rem; }
.big .pc { margin-left: auto; font-size: 1.8rem; font-weight: 700; color: var(--good); font-variant-numeric: tabular-nums; }
.checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem 1.2rem; }
.check { display: flex; align-items: center; gap: .7rem; padding: .6rem .9rem; border: 1px solid var(--line); border-radius: .6rem; font-size: 1.3rem; }
.check b { display: inline-grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%; background: var(--idle-bg); color: var(--idle); font-size: 1.1rem; }
.check.ok b { background: var(--good); color: #fff; }
.check .s { margin-left: auto; color: var(--muted); font-size: 1.05rem; }
.check.ok .s { color: var(--good); font-weight: 700; }
.note { font-size: 1.4rem; padding: .8rem 1rem; border-radius: .6rem; background: var(--note-bg); color: var(--note); }
.pdfb{width:100%;font:inherit;font-size:1.6rem;font-weight:700;padding:1.1rem;border-radius:.7rem;border:0;background:#1d4ed8;color:#fff;cursor:pointer}
#pdfv{position:fixed;inset:0;z-index:60;background:var(--bg,#fff);display:none;flex-direction:column}
#pdfv.on{display:flex}
#pdfv .ph{display:flex;align-items:center;gap:1rem;padding:.7rem 1rem;font-size:1.5rem;font-weight:700}
#pdfv .ph span{flex:1}
#pdfv .ph button{font:inherit;font-size:1.5rem;padding:.6rem 1.6rem;border-radius:.6rem;border:1px solid #888;background:transparent;color:inherit;cursor:pointer}
#pdfw{flex:1;overflow:auto;text-align:center;background:#888}#pdfw img{max-width:100%;max-height:100%;object-fit:contain}#pdfw.zm img{max-width:none;max-height:none;width:220%}
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;

const norm = (s) => String(s || "").normalize("NFKC").replace(/\s+/g, "").toLowerCase();
function parseSheet(v) {
  const groups = [];
  for (let i = 0; i < v.length; i++) {
    if ((v[i][0] || "") !== "施業NO.") continue;
    const g = { name: (v[i - 1] && v[i - 1][0]) || "施業", rows: [], hr: i + 1 };
    for (let j = i + 1; j < v.length && (v[j][0] || "") !== ""; j++) {
      const row = { sr: j + 1 }, c = v[j];
      Object.keys(FCOL).forEach((f) => {
        const raw = String(c[FCOL[f] - 1] === undefined ? "" : c[FCOL[f] - 1]).trim();
        if (raw === "") return;
        if (NUMF.has(f)) { const n = parseFloat(raw.replace(/,/g, "")); if (isFinite(n)) row[f] = n; }
        else row[f] = raw;
      });
      g.rows.push(row);
    }
    groups.push(g);
  }
  groups.forEach((g, gi) => {
    const cur = String((v[1 + gi] && v[1 + gi][23]) || "").trim();
    if (cur) { const hit = g.rows.find((r) => norm(r.no) === norm(cur)) || g.rows.find((r) => norm(r.no).startsWith(norm(cur))); if (hit) g.currentNo = hit.no; }
  });
  return { groups };
}
function setSync(txt, bad) { const el = $("asof"); if (el) { el.textContent = txt; el.style.color = bad ? "#c0392b" : ""; } }

async function loadData(force) {
  if (!force && busy()) return;
  try {
    const res = await fetch(API + "?k=" + encodeURIComponent(KEY), { cache: "no-store" });
    const j = await res.json();
    if (j && j.error === "key") { localStorage.removeItem(KEYSTORE); showLogin("合言葉が違います。もう一度入力してください。"); return; }
    if (!Array.isArray(j)) throw new Error("bad");
    if (!force && busy()) return;
    const gi = state.g;
    DATA = parseSheet(j);
    if (gi >= DATA.groups.length) state.g = 0;
    const d = new Date(); lastSync = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    setSync("同期 " + lastSync + " ✓");
    refresh();
  } catch (e) { setSync("通信できません(表示は前回の内容)", true); }
}
let wq = Promise.resolve();
function apiWrite(row, col, value) {
  pendingW++; setSync("保存中…");
  wq = wq.then(async () => {
    try {
      const res = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ k: KEY, row, col, value }) });
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || "ng");
    } catch (e) { setSync("保存できませんでした(" + (e && e.message ? e.message : "通信") + ")", true); pendingW = Math.max(0, pendingW - 1); loadData(true); return; }
    pendingW = Math.max(0, pendingW - 1);
    if (!pendingW) setSync("保存しました ✓");
  });
  return wq;
}
function setField(r, f, v) {

  apiWrite(r.sr, FCOL[f], v === undefined || v === null ? "" : v);
}

function renderFilters() {
  const rows = group().rows;
  const cats = [];
  rows.forEach((r) => { const c = species(r); if (!cats.includes(c)) cats.push(c); });
  const st = [["all", "すべて"], ["完了", "完了"], ["未完了", "未完了"]];
  $("filters").innerHTML =
    '<div class="fgroup"><span class="lab">状況</span>' +
    st.map((x) => '<button class="chip" data-st="' + x[0] + '" aria-pressed="' + (state.status === x[0]) + '">' + x[1] + "</button>").join("") + "</div>" +
    '<div class="count" id="count"></div>';
}
function markers() {
  const m = new Map();
  const g = group();
  const ord = g.rows.filter((r) => isNum(r.order)).sort((a, b) => a.order - b.order);
  // 「いまの施業」が指定されていればその行。なければ「順番が最小の未完了」
  const cur = g.currentNo ? g.rows.find((r) => r.no === g.currentNo) : ord.find((r) => status(r) === "未完了");
  if (cur) {
    m.set(cur, "cur");
    if (isNum(cur.order)) {
      const nx = ord.find((r) => r.order > cur.order && r !== cur && status(r) !== "完了");
      if (nx) m.set(nx, "next");
    }
  }
  return m;
}

function geoKey(r) {

let lmap = null, llayer = null, lbase = null, lroad = null, roadOn = true, curGeo = null, curK = null, m3 = null;

    eitem("施業予定面積", val(r.plan_ha, 2, "ha"), "plan_ha") + eitem("総面積", val(r.total_ha, 2, "ha"), "total_ha") + eitem("面積", val(r.area_m2, 0, "㎡"), "area_m2") + eitem("施業地", r.place ? esc(r.place) : NA, "place") + "</div></div>" +
    '<div class="sec"><h3>作業</h3><div class="grid">' +
    eitem("進行状況", pill(r), "status") + eitem("作業班", r.team ? esc(r.team) : NA, "team") + eitem("作業日", r.date ? esc(r.date) : NA, "date") + eitem("施業人日", days, "mandays") + "</div></div>" +
    '<div class="sec"><h3>確認状況</h3><div class="checks">' +
    check("測量(前)", r.survey_before, "survey_before") + check("測量状況", r.survey, "survey") + check("検査状況", r.inspect, "inspect") + check("施業写真", r.photo, "photo") + "</div></div>" +
    '<div class="sec"><h3>備考</h3>' + (editMode ? '<button class="item ed" data-f="note" style="width:100%"><div class="v">' + (r.note ? esc(r.note) : NA) + "</div></button>" : '<div class="note">' + (r.note ? esc(r.note) : "なし") + "</div>") + "</div>" +
    "</div>";
  panel.classList.add("on"); $("scrim").classList.add("on"); panel.setAttribute("aria-hidden", "false");
}

/* ---------- 順番を選ぶ ---------- */
let pick = null, pickTimer = null;
function setRow(r, n) { setField(r, "order", n === null ? "" : n); }
function setOrder(row, n) {
  const old = isNum(row.order) ? row.order : null;
  if (n !== null) {
    const other = group().rows.find((r) => r !== row && r.order === n);
    if (other) setRow(other, old); // 使用中の番号を選ぶと入れ替え
  }
  setRow(row, n);
}
function renderPicker() {
  const el = $("pk"), sc = $("pkscrim");
  if (!pick) { el.classList.remove("on"); sc.classList.remove("on"); el.innerHTML = ""; return; }
  const g = group(), N = Math.max(g.rows.length, 6);
  let btn = "";
  for (let n = 1; n <= N; n++) {
    const used = g.rows.find((r) => r.order === n && r !== pick);
    btn += '<button class="pkn' + (used ? " used" : "") + '" data-pn="' + n + '" aria-pressed="' + (pick.order === n) + '"' + (used ? ' title="' + esc(used.no) + ' と入れ替え"' : "") + ">" + n + "</button>";
  }
  const isCur = g.currentNo === pick.no;
  el.innerHTML = "<h3>順番を選ぶ</h3>" +
    '<div class="sub">' + esc(pick.no) + "　" + esc(pick.place || "") + "</div>" +
    '<div class="pkgrid">' + btn + "</div>" +
    '<div class="pkact">' +
    '<button class="pkb red" data-pk="cur"' + (isNum(pick.order) ? "" : " disabled") + ">" + (isCur ? "いまの施業(設定中)" : "いまの施業にする") + "</button>" +
    '<button class="pkb" data-pk="clear"' + (isNum(pick.order) ? "" : " disabled") + ">順番を消す</button>" +
    '<button class="pkb" data-pk="close">閉じる</button></div>' +
    '<div class="hint">●付きの番号は他の施業が使用中です。選ぶと、その施業と番号を入れ替えます。</div>';
  el.classList.add("on"); sc.classList.add("on");
}
function openPicker(i) {
  pick = view[i]; renderPicker();
  clearTimeout(pickTimer); pickTimer = setTimeout(closePicker, 60000);
}
function closePicker() { pick = null; clearTimeout(pickTimer); renderPicker(); }
function afterPick() { closePicker(); renderTiles(); renderList(); renderPanel(); }

/* ---------- 編集 ---------- */
const FLAB = { status: "進行状況", team: "作業班", date: "作業日", species: "植栽樹種", note: "備考", place: "施業地", area_m2: "面積(㎡)", total_ha: "総面積(ha)", plan_ha: "施業予定面積(ha)", mandays: "施業人日", plan_n: "植栽予定本数", done_n: "進捗(本)", apply_n: "申請本数", apply_ha: "申請面積" };
function startEdit(f, row) {
  const r = row || view[state.sel]; if (!r) return;
  if (f === "survey_before" || f === "survey" || f === "inspect" || f === "photo") { setField(r, f, r[f] === "〇" ? "" : "〇"); renderList(); renderPanel(); bump(); return; }
  editing = { r, f, buf: NUMF.has(f) ? (isNum(r[f]) ? String(r[f]) : "") : (r[f] || ""), first: true };
  renderEdit();
}
function renderEdit() {
  const el = $("ed"), sc = $("edscrim");
  if (!editing) { el.classList.remove("on"); sc.classList.remove("on"); el.innerHTML = ""; return; }
  const { r, f } = editing;
  let body = "";
  if (f === "status") {
    body = '<div class="edst">' + ["未完了", "完了", "ー"].map((s) => '<button data-sv="' + s + '" class="' + (status(r) === s ? "on" : "") + '">' + s + "</button>").join("") + "</div>";
  } else if (NUMF.has(f)) {
    body = '<div class="eddisp" id="eddisp">' + (editing.buf === "" ? "&nbsp;" : esc(editing.buf)) + '</div><div class="edpad">' +
      ["7","8","9","4","5","6","1","2","3","0",".","⌫"].map((k) => '<button data-k="' + k + '">' + k + "</button>").join("") + "</div>" +
      '<div class="edrow"><button data-k="clear">全部消す</button><button class="ok" data-ed="ok">決定</button></div>';
  } else {
    body = '<input id="edtxt" class="edtxt" type="text" value="' + esc(editing.buf) + '" autocomplete="off">' +
      '<div class="edrow"><button data-ed="clear">空にする</button><button class="ok" data-ed="ok">決定</button></div>';
  }
  el.innerHTML = "<h3>" + esc(FLAB[f] || f) + 'を変更</h3><div class="sub">' + esc(r.no) + "　" + esc(r.place || "") + "</div>" + body + '<div class="edrow"><button data-ed="cancel">キャンセル</button></div>';
  el.classList.add("on"); sc.classList.add("on");
  const ti = $("edtxt"); if (ti) setTimeout(() => { try { ti.focus(); ti.select(); } catch (e) {} }, 50);
}
function endEdit(ok, val) {
  if (ok && editing) {
    const { r, f } = editing;
    if (f === "status") setField(r, "status", val === "未完了" ? "" : val);
    else if (NUMF.has(f)) { const n = parseFloat(editing.buf); setField(r, f, editing.buf === "" || !isFinite(n) ? "" : n); }
    else setField(r, f, ($("edtxt") ? $("edtxt").value : editing.buf).trim());
  }
  editing = null; renderEdit(); renderTiles(); renderList(); renderPanel(); bump();
}

/* ---------- actions ---------- */
let idleTimer = null;
function bump() { if (editMode) { clearTimeout(emTimer); emTimer = setTimeout(() => setEditMode(false), 120000); }
   clearTimeout(idleTimer); if (state.sel !== null) idleTimer = setTimeout(() => { if (editing) bump(); else closeDetail(); }, 90000); }
function openDetail(i) {
  state.sel = i; renderList(); renderPanel(); bump();
  const c = $("close"); if (c) { try { c.focus({ preventScroll: true }); } catch (e) {} }
}
function closeDetail() {
  const i = state.sel; state.sel = null; renderList(); renderPanel(); clearTimeout(idleTimer);
  const row = document.querySelector('tr[data-i="' + i + '"]'); if (row) { try { row.focus({ preventScroll: true }); } catch (e) {} }
}
function go(d) { const n = state.sel + d; if (n >= 0 && n < view.length) { state.sel = n; renderList(); renderPanel(); bump(); const c = $("close"); if (c) c.focus({ preventScroll: true }); } }
function refresh() { renderTabs(); renderTiles(); renderFilters(); renderList(); renderPanel(); }

document.addEventListener("click", (e) => {
  if (editing) {
    const b = e.target.closest("button[data-sv], button[data-k], button[data-ed], #edscrim");
    if (!b) return;
    if (b.dataset.sv) endEdit(true, b.dataset.sv);
    else if (b.dataset.k) {
      const k = b.dataset.k;
      if (k === "clear") editing.buf = ""; else if (k === "⌫") editing.buf = editing.first ? "" : editing.buf.slice(0, -1);
      else { if (editing.first) editing.buf = ""; if (!(k === "." && editing.buf.includes("."))) editing.buf += k; }
      editing.first = false; $("eddisp").innerHTML = editing.buf === "" ? "&nbsp;" : esc(editing.buf);
    }
    else if (b.dataset.ed === "ok") endEdit(true);
    else if (b.dataset.ed === "clear") { $("edtxt").value = ""; $("edtxt").focus(); }
    else endEdit(false);
    return;
  }
  if (e.target.closest && e.target.closest("#emb")) { setEditMode(!editMode); return; }
  const lp = editMode && e.target.closest && e.target.closest("tbody .pill");
  if (lp && lp.closest("tr[data-i]")) { startEdit("status", view[+lp.closest("tr[data-i]").dataset.i]); return; }
  if (editMode && e.target.closest && e.target.closest("button.ed")) { startEdit(e.target.closest("button.ed").dataset.f); return; }
  if (pick) {
    const pb = e.target.closest("button[data-pn], button[data-pk], #pkscrim");
    if (!pb) return;
    if (pb.dataset.pn !== undefined) { setOrder(pick, +pb.dataset.pn); afterPick(); }
    else if (pb.dataset.pk === "clear") { setOrder(pick, null); afterPick(); }
    else if (pb.dataset.pk === "cur") { group().currentNo = pick.no; apiWrite(2 + state.g, 24, pick.no); afterPick(); }
    else closePicker();
    return;
  }
  const od = editMode && e.target.closest("tbody td.ord");
  if (od && od.parentElement.dataset.i !== undefined) { openPicker(+od.parentElement.dataset.i); return; }
  const t = e.target.closest("button, tr[data-i], #scrim");
  if (!t) return;
  if (t.id === "pdfopen") { openPdf(view[state.sel]); return; }
  if (t.id === "mapopen") { openMap(view[state.sel]); return; }
  if (t.id === "mapx") { closeMap(); return; }
  if (t.dataset.bl) { stopAuto(); $("c3d").style.display = "none"; if (m3) { m3.remove(); m3 = null; } $("map3d").style.display = "none"; $("map").style.visibility = "visible"; $("b3d").classList.remove("on"); lmap.invalidateSize(); setBase(t.dataset.bl); return; }
  if (t.dataset.rot && m3) { stopAuto(); m3.easeTo({ bearing: m3.getBearing() + +t.dataset.rot, duration: 600 }); return; }
  if (t.dataset.tilt && m3) { m3.easeTo({ pitch: Math.max(0, Math.min(85, m3.getPitch() + +t.dataset.tilt)), duration: 400 }); return; }
  if (t.dataset.z && m3) { m3.easeTo({ zoom: m3.getZoom() + +t.dataset.z, duration: 300 }); return; }
  if (t.id === "btog" && m3) { const p = m3.getPitch(); if (p > 5) { lastPitch = p; m3.easeTo({ pitch: 0, duration: 500 }); } else { m3.easeTo({ pitch: lastPitch || 65, duration: 500 }); } return; }
  if (t.id === "bauto") { autoRot = !autoRot; t.classList.toggle("on", autoRot); if (autoRot) requestAnimationFrame(autoStep); return; }
  if (t.id === "broad") { roadOn = !roadOn; setRoad(); return; }
  if (t.id === "b3d") { open3D(); return; }
  if (t.dataset.ex) { exag(+t.dataset.ex); return; }
  if (t.id === "pdfx") { closePdf(); return; }
  if (t.id === "pdfz") { $("pdfw").classList.toggle("zm"); return; }
  if (t.dataset.g !== undefined) { state.g = +t.dataset.g; state.status = "all"; state.sp = "all"; state.sel = null; refresh(); }
  else if (t.dataset.st !== undefined) { state.status = t.dataset.st; state.sel = null; renderFilters(); renderList(); renderPanel(); }
  else if (t.dataset.sp !== undefined) { state.sp = t.dataset.sp; state.sel = null; renderFilters(); renderList(); renderPanel(); }
  else if (t.dataset.i !== undefined) openDetail(+t.dataset.i);
  else if (t.id === "close" || t.id === "scrim") closeDetail();
  else if (t.id === "prev") go(-1);
  else if (t.id === "next") go(1);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && editing && e.target.id === "edtxt") endEdit(true);
  else if (e.key === "Escape" && editing) endEdit(false);
  else if (e.key === "Escape" && pick) closePicker();
  else if (e.key === "Escape" && state.sel !== null) closeDetail();
  else if (e.key === "ArrowLeft" && state.sel !== null) go(-1);
  else if (e.key === "ArrowRight" && state.sel !== null) go(1);
  else if (e.key === "Enter" && e.target.matches && e.target.matches("tr[data-i]")) openDetail(+e.target.dataset.i);
});
["pointerdown", "keydown", "wheel"].forEach((ev) => document.addEventListener(ev, bump, { passive: true }));

renderClock(); setInterval(renderClock, 30000);
function showLogin(msg) { $("lgm").textContent = msg || ""; $("lg").classList.add("on"); }
let pollOn = false;
async function startUp() {
  KEY = localStorage.getItem(KEYSTORE) || "";
  if (!KEY) { showLogin(""); return; }
  setSync("読み込み中…"); await loadData(true); pollOn = true; setInterval(() => loadData(false), 30000);
}
$("lgb").addEventListener("click", async () => {
  const v = $("lgi").value.trim(); if (!v) return;
  localStorage.setItem(KEYSTORE, v); KEY = v; $("lg").classList.remove("on");
  setSync("読み込み中…"); await loadData(true);
  if (!pollOn) { pollOn = true; setInterval(() => loadData(false), 30000); }
});
startUp();
